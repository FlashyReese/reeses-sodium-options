modLoader = "javafml"
loaderVersion = "[65,)"
license = "MIT"
clientSideOnly = true

[[mods]]
modId = "reeses_sodium_options"
version = "${version}"
displayName = "Reese's Sodium Options"
logoFile = "assets/reeses-sodium-options/icon.png"
authors = "FlashyReese"
description = '''
Replaces Sodium's Options Screen
'''

[modproperties.reeses_sodium_options]
"sodium:config_api_user" = "me.flashyreese.mods.reeses_sodium_options.client.config.ReeseSodiumOptionsConfigEntryPoint"

[[dependencies.reeses_sodium_options]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[${minecraft_version}]"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.reeses_sodium_options]]
    modId = "forge"
    mandatory = true
    versionRange = "[65,)"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.reeses_sodium_options]]
    modId = "sodium"
    mandatory = true
    versionRange = "[${sodium_version}]"
    ordering = "AFTER"
    side = "CLIENT"
